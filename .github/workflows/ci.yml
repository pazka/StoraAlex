name: ci
# Upgrade safety net (see TESTING.md): unit/characterization tests on the
# Node major the Dockerfile uses (26 LTS; Node 20 is EOL, 24 dropped with
# pazka/hosh-management#5), then build the real image, check its Node version
# (scripts/check-node-version.sh) and smoke it with its production hardening flags. Runs on every PR (incl. Dependabot), on main, and
# on agent/** branches so an agent gets CI without opening a PR.
on:
  pull_request:
  push:
    branches: [main, 'agent/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    # Same base image family as the Dockerfile, so glibc/native binaries match.
    container: node:${{ matrix.node }}-slim
    strategy:
      fail-fast: false
      matrix:
        node: ['26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  smoke:
    name: container smoke
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: storalex:smoke
      - name: Node version guardrail (CVE-2026-111497, pazka/hosh-management#5)
        run: bash scripts/check-node-version.sh storalex:smoke
      - name: Guardrail rejects an unpatched Node (test of the test)
        run: |
          if bash scripts/check-node-version.sh node:24.21.0-slim; then
            echo "::error::check-node-version.sh accepted node:24.21.0-slim (unpatched, < 24.22.3)"
            exit 1
          fi
          echo "guardrail correctly rejected node:24.21.0-slim"
      - run: bash scripts/smoke.sh storalex:smoke
      # The box's legacy compose (until the hosh-deploy cutover), verbatim: uid 1000, :8080 on
      # 127.0.0.1:8090, .env, volume, Google SA bind mount. Data must survive a re-creation.
      - name: Legacy compose (box today) - full capability + data kept across re-creation
        run: bash scripts/compose-smoke.sh legacy storalex:smoke
      # hosh-deploy (DEPLOY.md): what `register` validates on the box, and a test of that check.
      - name: Box register validation (hosh-deploy register, simulated)
        run: |
          bash scripts/register-check.sh
          t="$(mktemp -d)" && cp -r deploy .env.example "$t"/ && sed '/read_only: true/d' docker-compose.example.yml > "$t/docker-compose.example.yml"
          if bash scripts/register-check.sh "$t"; then echo "::error::register-check accepted a writable rootfs"; exit 1; fi
          echo "register-check correctly rejected a compose without read_only"
      # docker-compose.example.yml as hosh-deploy runs it: uid 10001, read-only, PORT=8000 on
      # 127.0.0.1:9138, service account as base64 env, POST_DEPLOY via compose exec.
      - name: Template compose (hosh-deploy) - full capability + POST_DEPLOY + data kept
        run: bash scripts/compose-smoke.sh template storalex:smoke
      # DEPLOY.md "Cutover from legacy", its shell blocks run verbatim: same DB/photos/passwords.
      - name: Cutover legacy -> hosh-deploy (DEPLOY.md 1b) + rollback
        run: bash scripts/compose-smoke.sh cutover storalex:smoke
