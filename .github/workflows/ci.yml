name: ci
# Upgrade safety net (see TESTING.md): unit/characterization tests on the
# current AND next Node major, then build the real image and smoke it with its
# production hardening flags. Runs on every PR (incl. Dependabot), on main, and
# on agent/** branches so an agent gets CI without opening a PR.
on:
  pull_request:
  push:
    branches: [main, 'agent/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    # Same base image family as the Dockerfile, so glibc/native binaries match.
    container: node:${{ matrix.node }}-slim
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  smoke:
    name: container smoke
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: storalex:smoke
      - run: bash scripts/smoke.sh storalex:smoke
