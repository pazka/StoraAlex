name: ci
# Upgrade safety net (see TESTING.md): unit/characterization tests on the
# Node major the Dockerfile uses (26 LTS; Node 20 is EOL, 24 dropped with
# pazka/hosh-management#5), then build the real image, check its Node version
# (scripts/check-node-version.sh) and smoke it with its production hardening flags. Runs on every PR (incl. Dependabot), on main, and
# on agent/** branches so an agent gets CI without opening a PR.
on:
  pull_request:
  push:
    branches: [main, 'agent/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    # Same base image family as the Dockerfile, so glibc/native binaries match.
    container: node:${{ matrix.node }}-slim
    strategy:
      fail-fast: false
      matrix:
        node: ['26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  smoke:
    name: container smoke
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: storalex:smoke
      - name: Node version guardrail (CVE-2026-111497, pazka/hosh-management#5)
        run: bash scripts/check-node-version.sh storalex:smoke
      - name: Guardrail rejects an unpatched Node (test of the test)
        run: |
          if bash scripts/check-node-version.sh node:24.21.0-slim; then
            echo "::error::check-node-version.sh accepted node:24.21.0-slim (unpatched, < 24.22.1)"
            exit 1
          fi
          echo "guardrail correctly rejected node:24.21.0-slim"
      - run: bash scripts/smoke.sh storalex:smoke
