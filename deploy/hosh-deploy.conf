# Read ONCE by `hosh-deploy register storalex` on the box (box standard, Decision #16), which
# validates the compose hardening and pins the result in /etc/hosh-deploy/apps/storalex.conf.
# Changing this file in the repo changes nothing on the box until someone re-registers there.
SERVICE=storalex
IMAGE_REPO=ghcr.io/pazka/storalex
IMAGE_VAR=APP_IMAGE
ENV_FILE=storalex.env
HOST=storalex.hosh.it
BIND=127.0.0.1:9138
HEALTH=/healthz
# Capability smoke run INSIDE the container after each deploy (argv, no shell; non-zero ⇒ auto-rollback).
# Read-only: /healthz (DB + writable storage), PWA shell/bundle/service worker/manifest + CSP, auth
# gate on /api and /media, no source/dotfile leak, argon2id and sharp native modules in memory.
POST_DEPLOY=/usr/local/bin/node /app/dist/server/postdeploy.js http://127.0.0.1:8000
REPO=pazka/StoraAlex
